openapi: 3.0.3
info:
  title: Finance Dashboard API
  description: |
    A production-grade RESTful API for managing financial records, users, and dashboard analytics.
    
    ## Authentication
    All protected endpoints require a Bearer JWT token in the `Authorization` header:
    ```
    Authorization: Bearer <your_token>
    ```
    
    ## Roles & Permissions
    | Role     | Read | Analytics | Write | Delete | Manage Users |
    |----------|------|-----------|-------|--------|--------------|
    | viewer   | ✅   | ❌        | ❌    | ❌     | ❌           |
    | analyst  | ✅   | ✅        | ❌    | ❌     | ❌           |
    | admin    | ✅   | ✅        | ✅    | ✅     | ✅           |
    
  version: 1.0.0
  contact:
    name: Finance Dashboard API

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management (Admin only)
  - name: Records
    description: Financial record management
  - name: Dashboard
    description: Analytics and summary endpoints

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: "64f1a2b3c4d5e6f7a8b9c0d1"
        name:
          type: string
          example: "Alice Admin"
        email:
          type: string
          example: "admin@example.com"
        role:
          type: string
          enum: [viewer, analyst, admin]
        status:
          type: string
          enum: [active, inactive]
        lastLogin:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FinancialRecord:
      type: object
      properties:
        _id:
          type: string
          example: "64f1a2b3c4d5e6f7a8b9c0d2"
        amount:
          type: number
          example: 2500.00
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
          example: "Salary"
        date:
          type: string
          format: date-time
        note:
          type: string
          example: "Monthly salary deposit"
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  example: "john@example.com"
                password:
                  type: string
                  example: "SecurePass1"
                role:
                  type: string
                  enum: [viewer, analyst, admin]
                  default: viewer
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          token:
                            type: string
        '400':
          description: Validation error or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "admin@example.com"
                password:
                  type: string
                  example: "Admin1234"
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile fetched
        '401':
          description: Unauthorized

  /users:
    get:
      tags: [Users]
      summary: Get all users (paginated)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: role
          schema:
            type: string
            enum: [viewer, analyst, admin]
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Users list
        '403':
          description: Forbidden

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
        '404':
          description: User not found

    patch:
      tags: [Users]
      summary: Update user role or status
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [viewer, analyst, admin]
                status:
                  type: string
                  enum: [active, inactive]
                name:
                  type: string
      responses:
        '200':
          description: User updated
        '404':
          description: User not found

    delete:
      tags: [Users]
      summary: Soft-delete a user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '404':
          description: User not found

  /records:
    get:
      tags: [Records]
      summary: Get all financial records (all roles)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: type
          schema:
            type: string
            enum: [income, expense]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - in: query
          name: endDate
          schema:
            type: string
            format: date
            example: "2024-12-31"
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sortBy
          schema:
            type: string
            default: date
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Records list

    post:
      tags: [Records]
      summary: Create a new financial record (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, type, category]
              properties:
                amount:
                  type: number
                  example: 2500.00
                type:
                  type: string
                  enum: [income, expense]
                category:
                  type: string
                  example: "Salary"
                date:
                  type: string
                  format: date
                  example: "2024-06-15"
                note:
                  type: string
                  example: "June salary"
      responses:
        '201':
          description: Record created
        '403':
          description: Forbidden

  /records/{id}:
    get:
      tags: [Records]
      summary: Get a single record (all roles)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Record found
        '404':
          description: Not found

    put:
      tags: [Records]
      summary: Update a record (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                type:
                  type: string
                  enum: [income, expense]
                category:
                  type: string
                date:
                  type: string
                  format: date
                note:
                  type: string
      responses:
        '200':
          description: Record updated

    delete:
      tags: [Records]
      summary: Soft-delete a record (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Record deleted

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Total income, expenses, net balance, last 5 transactions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Summary data
        '403':
          description: Viewer role cannot access analytics

  /dashboard/categories:
    get:
      tags: [Dashboard]
      summary: Category-wise totals
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [income, expense]
      responses:
        '200':
          description: Category breakdown

  /dashboard/trends:
    get:
      tags: [Dashboard]
      summary: Monthly income/expense trends
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: months
          schema:
            type: integer
            default: 12
            maximum: 24
      responses:
        '200':
          description: Monthly trends data

  /dashboard/range-summary:
    get:
      tags: [Dashboard]
      summary: Summary stats for a custom date range
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Range summary
